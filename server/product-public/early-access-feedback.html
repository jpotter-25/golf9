<!doctype html>
<html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Early Access Feedback | Nine Below</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/brand/nine-below-icon-v2.png" type="image/png"><link rel="stylesheet" href="/brand/styles.css?v=20260818-2"></head>
<body class="early-access-page" data-early-access-page="feedback"><header class="site-header site-header--solid"><nav class="nav shell"><a class="brand" href="/"><img src="/brand/nine-below-icon-v2.png" width="44" height="44" alt=""><span>Nine Below by Potterwell</span></a></nav></header><main class="early-access-action shell"><section class="early-access-card action-card action-card--wide"><p class="eyebrow">Help shape the table</p><h1>Early-access feedback.</h1><p>Specific observations help us reproduce problems and make better decisions. Never include a password or private invite code.</p><form id="feedback-form" class="early-access-form"><div class="form-grid"><label>Category<select name="category"><option value="bug">Bug</option><option value="gameplay">Gameplay</option><option value="performance">Performance</option><option value="account_install">Account or install</option><option value="other">Other</option></select></label><label>Severity<select name="severity"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="blocking">Blocking</option></select></label></div><div class="form-grid"><label>Build <span class="optional">Optional</span><input name="build" maxlength="60" placeholder="Version or build number"></label><label>Device <span class="optional">Optional</span><input name="device" maxlength="120"></label></div><label>Steps to reproduce <span class="optional">Optional</span><textarea name="steps" rows="5" maxlength="1200"></textarea></label><label>What did you expect? <span class="optional">Optional</span><textarea name="expected" rows="4" maxlength="800"></textarea></label><label>What actually happened?<textarea name="actual" rows="6" maxlength="1200" required></textarea></label><label class="honeypot" aria-hidden="true">Company <input name="company" tabindex="-1" autocomplete="off"></label><p class="form-status" id="action-status" role="status" aria-live="polite"></p><button class="button button--primary" type="submit">Send feedback</button></form><section id="feedback-success" hidden><div class="success-mark" aria-hidden="true">&#10003;</div><h2>Feedback received.</h2><p>Your reference is <strong id="feedback-reference"></strong>.</p><a id="feedback-tracking" class="button button--quiet" href="/support/ticket">View private support case</a></section></section></main><script src="/brand/early-access.js?v=20260818-2" defer></script></body></html>
